<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Адмін — Book Oracle</title>
<style>


* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; font-weight: 300; background: #fff; color: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.wrap { width: 100%; max-width: 340px; text-align: center; }
.label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #aaa; margin-bottom: 2rem; }
h1 { font-size: 1.3rem; font-weight: 500; margin-bottom: 2rem; }
input[type=password] { width: 100%; padding: 0.9rem 1rem; border: 1px solid #e5e5e5; border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 300; outline: none; margin-bottom: 0.75rem; text-align: center; transition: border-color 0.2s; }
input[type=password]:focus { border-color: #dbb3c3; }
button { width: 100%; padding: 0.9rem; background: #111; color: #fff; border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; }
button:hover { background: #333; }
.err { font-size: 0.8rem; color: #c0392b; margin-top: 0.75rem; display: none; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="label">Book Oracle</div>
  <h1>Адмін-панель</h1>
  <input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Увійти</button>
  <div class="err" id="err">Невірний пароль</div>
</div>
<script>
async function login() {
  const pwd = document.getElementById('pwd').value;
  const res = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password: pwd}) });
  const data = await res.json();
  if (data.ok) { window.location.href = '/admin'; }
  else { document.getElementById('err').style.display = 'block'; }
}
</script>
</body>
</html>
