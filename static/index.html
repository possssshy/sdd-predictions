<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Передбачення — SlashDotDash</title>
<style>
@font-face { font-family: 'MuseoSans'; src: url('/static/Fontspring-DEMO-MuseoSans_300.otf'); font-weight: 300; }
@font-face { font-family: 'MuseoSans'; src: url('/static/Fontspring-DEMO-MuseoSans_500.otf'); font-weight: 500; }
@font-face { font-family: 'MuseoSans'; src: url('/static/Fontspring-DEMO-MuseoSans_700.otf'); font-weight: 700; }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'MuseoSans', sans-serif;
  font-weight: 300;
  background: #fff;
  color: #111;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

.wrap {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.brand {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 2.5rem;
}

.title {
  font-size: 1.6rem;
  font-weight: 500;
  line-height: 1.3;
  margin-bottom: 0.75rem;
  color: #111;
}

.subtitle {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 0.4rem;
  line-height: 1.6;
}

.book-name {
  font-size: 0.85rem;
  color: #dbb3c3;
  font-weight: 500;
  margin-bottom: 2.5rem;
}

.divider {
  width: 40px;
  height: 1px;
  background: #dbb3c3;
  margin: 0 auto 2.5rem;
}

.prompt {
  font-size: 1rem;
  color: #333;
  margin-bottom: 2rem;
  line-height: 1.6;
}

.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  width: 100%;
  margin-bottom: 1.25rem;
}

.field-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.field-wrap label {
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #aaa;
  text-align: left;
}

input[type=number] {
  width: 100%;
  padding: 0.9rem 1rem;
  border: 1px solid #e5e5e5;
  border-radius: 4px;
  font-family: 'MuseoSans', sans-serif;
  font-size: 1.1rem;
  font-weight: 300;
  color: #111;
  background: #fff;
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type=number]:focus { border-color: #dbb3c3; }

.btn-submit {
  width: 100%;
  padding: 1rem;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: 'MuseoSans', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  margin-bottom: 0.75rem;
}
.btn-submit:hover { background: #222; }
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }

.btn-random {
  width: 100%;
  padding: 0.75rem;
  background: transparent;
  color: #aaa;
  border: 1px solid #e5e5e5;
  border-radius: 4px;
  font-family: 'MuseoSans', sans-serif;
  font-size: 0.8rem;
  font-weight: 300;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-random:hover { border-color: #dbb3c3; color: #dbb3c3; }

/* Result */
.result {
  display: none;
  width: 100%;
  margin-top: 2.5rem;
  padding-top: 2.5rem;
  border-top: 1px solid #f0f0f0;
  text-align: center;
}

.result-label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #dbb3c3;
  margin-bottom: 1.25rem;
}

.result-text {
  font-size: 1.1rem;
  font-weight: 300;
  line-height: 1.8;
  color: #111;
  margin-bottom: 1.5rem;
  font-style: italic;
}

.result-meta {
  font-size: 0.7rem;
  color: #ccc;
  letter-spacing: 0.05em;
}

.btn-again {
  margin-top: 2rem;
  padding: 0.65rem 1.5rem;
  background: transparent;
  border: 1px solid #e5e5e5;
  border-radius: 4px;
  font-family: 'MuseoSans', sans-serif;
  font-size: 0.75rem;
  color: #888;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
}
.btn-again:hover { border-color: #dbb3c3; color: #dbb3c3; }

.error-msg {
  font-size: 0.8rem;
  color: #c0392b;
  margin-top: 0.75rem;
  display: none;
}

/* Loading */
.loader {
  display: none;
  width: 20px;
  height: 20px;
  border: 2px solid #e5e5e5;
  border-top-color: #dbb3c3;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 1rem auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* No book */
.no-book {
  font-size: 0.85rem;
  color: #ccc;
  text-align: center;
  padding: 2rem 0;
}
</style>
</head>
<body>
<div class="wrap" id="main-wrap">
  <div class="brand">SlashDotDash</div>

  <div id="loading-state">
    <div class="loader" style="display:block"></div>
  </div>

  <div id="content-state" style="display:none">
    <h1 class="title">Передбачення<br>від SlashDotDash</h1>
    <p class="subtitle">У цьому місяці гадаємо на книзі</p>
    <p class="book-name" id="book-title">—</p>

    <div class="divider"></div>

    <p class="prompt">Задайте питання і починаємо гадати 🪄<br>Вкажіть номер сторінки та рядка</p>

    <div class="fields">
      <div class="field-wrap">
        <label>Сторінка</label>
        <input type="number" id="inp-page" placeholder="12" min="1">
      </div>
      <div class="field-wrap">
        <label>Рядок</label>
        <input type="number" id="inp-line" placeholder="5" min="1">
      </div>
    </div>

    <button class="btn-submit" onclick="getProphecy()">Дізнатись передбачення</button>
    <button class="btn-random" onclick="getRandom()">✦ Випадкове передбачення</button>

    <div class="error-msg" id="error-msg"></div>
    <div class="loader" id="loader"></div>

    <div class="result" id="result">
      <div class="result-label">Твоє передбачення</div>
      <div class="result-text" id="result-text"></div>
      <div class="result-meta" id="result-meta"></div>
      <button class="btn-again" onclick="reset()">Гадати ще раз</button>
    </div>
  </div>

  <div id="no-book-state" style="display:none">
    <p class="no-book">Книга ще не завантажена.<br>Повертайтесь пізніше 🌙</p>
  </div>
</div>

<script>
let bookLoaded = false;
let bookTitle = '';

async function loadBookInfo() {
  try {
    const res = await fetch('/api/book-info');
    const data = await res.json();
    document.getElementById('loading-state').style.display = 'none';
    if (data.loaded) {
      bookLoaded = true;
      bookTitle = data.title;
      document.getElementById('book-title').textContent = data.title;
      document.getElementById('content-state').style.display = 'block';
    } else {
      document.getElementById('no-book-state').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('no-book-state').style.display = 'block';
  }
}

async function getProphecy() {
  const page = document.getElementById('inp-page').value;
  const line = document.getElementById('inp-line').value;
  if (!page || !line) { showError('Вкажіть сторінку і рядок'); return; }
  await fetchProphecy({ page, line });
}

async function getRandom() {
  await fetchProphecy({});
}

async function fetchProphecy(params) {
  hideError();
  showLoader(true);
  try {
    const res = await fetch('/api/prophecy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await res.json();
    showLoader(false);
    if (data.error) { showError(data.error); return; }
    showResult(data);
  } catch(e) {
    showLoader(false);
    showError('Помилка з\'єднання. Спробуйте ще раз.');
  }
}

function showResult(data) {
  document.getElementById('result-text').textContent = data.text;
  const meta = data.mode === 'random'
    ? bookTitle
    : bookTitle + ' — стор. ' + data.page + ', рядок ' + data.line;
  document.getElementById('result-meta').textContent = meta;
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function reset() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('inp-page').value = '';
  document.getElementById('inp-line').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }
function showLoader(v) { document.getElementById('loader').style.display = v ? 'block' : 'none'; }

loadBookInfo();
</script>
</body>
</html>
